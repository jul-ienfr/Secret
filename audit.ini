# Preset d'options pour github_audit_scanner.py — passe via --config audit.ini
# Section [audit] uniquement. Chaque cle = une option CLI (sans les --).
# La CLI reste prioritaire si les deux sont precises.

[audit]
# Contexte affiche autour de chaque occurrence (grep -C equivalent)
context = 2

# Detection de chaines aleatoires type cle/token (haute entropie Shannon)
entropy = true
entropy_threshold = 4.5
entropy_min_len = 20

# Mode SECRETS : categories / severite / heuristiques (voir --list-rules)
# only_category = ai,cloud,oauth
# skip_category = generic,payments
# min_severity = high
# no_generic = true
# rules_file = api_key_rules.example.json

# Compatibilite : le mode SECRETS est toujours autorise ; cette option est sans effet.
# authorized = true

# Secrets en clair dans les rapports (defaut : true).
# Mettre false pour masquer (equivalent a --no-reveal).
# reveal = true

# Plafond de fichiers par depot distant (0 = sans limite, anti quota API)
max_files_per_repo = 5000

# Exclusions de chemins (repetable, fnmatch ou sous-chaine)
# exclude = vendor/
# exclude = *.lock

# Extensions analysees uniquement (repetable, '.py' ou 'py')
# include_ext = py
